    --panel: #070a07;
    --panel-2: #0a0f0a;
    --primary: #00ff41;
    --primary-dim: #00c933;
    --amber: #ffb000;
    --danger: #ff3b30;
    --ink: #c9f7d4;
    --muted: #6f856f;
    --line: rgba(0, 255, 65, 0.22);
  }
}
html,
body {
  background: var(--surface);
  color: var(--primary);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
* {
  scrollbar-color: var(--primary-dim) var(--panel);
}
.boot-scroll::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
.boot-scroll::-webkit-scrollbar-thumb {
  background: rgba(0, 255, 65, 0.35);
}
.boot-scroll::-webkit-scrollbar-track {
  background: #070a07;
}
@keyframes blinkCaret {
  0%, 49% {
    opacity: 1;
  }
  50%, 100% {
    opacity: 0;
  }
}
.caret-blink {
  animation: blinkCaret 1s steps(1) infinite;
}
@keyframes scanPulse {
  0% {
    box-shadow: 0 0 0 0 rgba(0, 255, 65, 0.35);
  }
  70% {
    box-shadow: 0 0 0 8px rgba(0, 255, 65, 0);
  }
  100% {
    box-shadow: 0 0 0 0 rgba(0, 255, 65, 0);
  }
}
.pulse-dot {
  animation: scanPulse 1.6s ease-out infinite;
}
.hover\:bg-\[rgba\(0\2c 255\2c 65\2c 0\.12\)\]:hover {
  background-color: rgba(0,255,65,0.12);
}
.focus\:outline-none:focus {
  outline: 2px solid transparent;
  outline-offset: 2px;
}
.focus\:ring-1:focus {
  --tw-ring-offset-shadow: var(--tw-ring-inset) 0 0 0 var(--tw-ring-offset-width) var(--tw-ring-offset-color);
  --tw-ring-shadow: var(--tw-ring-inset) 0 0 0 calc(1px + var(--tw-ring-offset-width)) var(--tw-ring-color);
  box-shadow: var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow, 0 0 #0000);
}
.focus\:ring-\[var\(--primary\)\]:focus {
  --tw-ring-color: var(--primary);
}
.active\:bg-\[rgba\(0\2c 255\2c 65\2c 0\.22\)\]:active {
  background-color: rgba(0,255,65,0.22);
}
.disabled\:pointer-events-none:disabled {
  pointer-events: none;
}
.disabled\:opacity-40:disabled {
  opacity: 0.4;
}
@media (min-width: 640px) {
  .sm\:col-span-1 {
    grid-column: span 1 / span 1;
  }
  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }
  .sm\:text-\[11px\] {
    font-size: 11px;
  }
  .sm\:text-lg {
    font-size: 1.125rem;
    line-height: 1.75rem;
  }
  .sm\:text-xs {
    font-size: 0.75rem;
    line-height: 1rem;
  }
}
@media (min-width: 1024px) {
  .lg\:h-\[560px\] {
    height: 560px;
  }
  .lg\:grid-cols-5 {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
  .lg\:grid-cols-\[minmax\(300px\2c 420px\)_minmax\(320px\2c 1fr\)_minmax\(260px\2c 340px\)\] {
    grid-template-columns: minmax(300px,420px) minmax(320px,1fr) minmax(260px,340px);
  }
}
