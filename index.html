:root {
  --surface: #050505;
  --panel: #090d09;
  --panel-2: #0c120c;
  --ink: #00ff41;
  --ink-dim: #00b32e;
  --amber: #ffbf00;
  --fail: #ff0040;
  --line: #1d2b1d;
  --line-bright: #2e4a2e;
  --muted: #7d9b7d;
  --faint: #43543f;
  --led-off: #263326;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface: #050505;
    --panel: #090d09;
    --panel-2: #0c120c;
    --ink: #00ff41;
    --ink-dim: #00b32e;
    --amber: #ffbf00;
    --fail: #ff0040;
    --line: #1d2b1d;
    --line-bright: #2e4a2e;
    --muted: #7d9b7d;
    --faint: #43543f;
    --led-off: #263326;
  }
}
html,
body {
  background: var(--surface);
  color: var(--ink);
  font-family: ui-monospace, "Cascadia Mono", "JetBrains Mono", Menlo, Consolas,
    "Liberation Mono", monospace;
}
::-moz-selection {
  background: var(--ink);
  color: #050505;
}
::selection {
  background: var(--ink);
  color: #050505;
}
/* thin terminal scrollbar for the bounded content scroller */
.term-scroll {
  scrollbar-width: thin;
  scrollbar-color: var(--line-bright) var(--surface);
}
.term-scroll::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
.term-scroll::-webkit-scrollbar-thumb {
  background: var(--line-bright);
}
.term-scroll::-webkit-scrollbar-track {
  background: var(--surface);
}
/* CRT scanline veil over the HOLO stage only */
.scanlines {
  position: relative;
}
.scanlines::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0, 0, 0, 0) 0px,
    rgba(0, 0, 0, 0) 2px,
    rgba(0, 0, 0, 0.22) 3px,
    rgba(0, 0, 0, 0.22) 4px
  );
  mix-blend-mode: multiply;
}
@keyframes led-blink {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.25;
  }
}
.led-blink {
  animation: led-blink 1.1s steps(2, start) infinite;
}
@keyframes caret-blink {
  0%,
  49% {
    opacity: 1;
  }
  50%,
  100% {
    opacity: 0;
  }
}
.caret-blink {
  animation: caret-blink 1s step-end infinite;
}
@keyframes sweep {
  0% {
    transform: translateX(-100%);
  }
  100% {
    transform: translateX(400%);
  }
}
.sweep-bar {
  animation: sweep 1.2s linear infinite;
}
.last\:border-b-0:last-child {
  border-bottom-width: 0px;
}
.hover\:bg-\[var\(--panel-2\)\]:hover {
  background-color: var(--panel-2);
}
.disabled\:cursor-not-allowed:disabled {
  cursor: not-allowed;
}
.disabled\:opacity-40:disabled {
  opacity: 0.4;
}
@media (min-width: 640px) {
  .sm\:inline {
    display: inline;
  }
  .sm\:px-4 {
    padding-left: 1rem;
    padding-right: 1rem;
  }
  .sm\:text-\[9px\] {
    font-size: 9px;
  }
  .sm\:text-base {
    font-size: 1rem;
    line-height: 1.5rem;
  }
}
@media (min-width: 768px) {
  .md\:inline {
    display: inline;
  }
  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
